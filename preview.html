function validateTimeline(data){if(!Array.isArray(data.cues))throw Error('cues 배열 필요');let end=0;for(const c of data.cues){if(!Number.isFinite(c.start)||!Number.isFinite(c.end)||c.start<end||c.end<=c.start||!vis.includes(c.viseme))throw Error('시각/입 모양 오류 또는 겹침');end=c.end;}return data.cues;}
document.querySelector('#timing').onchange=async e=>{try{cues=validateTimeline(JSON.parse(await e.target.files[0].text()));status.textContent=cues.length+'개 타이밍 로드';}catch(err){cues=[];status.textContent=err.message;}};
